name: Android launch and screenshot smoke

on:
  push:
    paths:
      - '.github/workflows/emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM hardware acceleration where available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: |
            ./gradlew :app:assembleDebug --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.socialboost.app/.MainActivity
            sleep 12
            if ! adb shell pidof com.socialboost.app; then
              adb logcat -d -t 300 | tail -100
              echo "App process not alive after launch"
              exit 1
            fi
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/login-screen.png
            test -s screenshots/login-screen.png
      - name: Upload real emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SocialBoost-emulator-screen
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
